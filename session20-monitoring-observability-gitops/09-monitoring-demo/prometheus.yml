global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # CPU, memory, disk of the docker host
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
