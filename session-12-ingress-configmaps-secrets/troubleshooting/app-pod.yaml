apiVersion: v1
kind: Pod
metadata:
  name: db-client
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "if [ \"$DB_PASSWORD\" = \"mypassword\" ]; then echo 'DB login OK'; else echo 'FATAL: password authentication failed'; fi; sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: DB_PASSWORD
