apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          # keeps sending requests to the hpa-demo service
          command: ["sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
